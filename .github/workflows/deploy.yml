name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            # Clone repo if it doesn't exist, otherwise pull
            if [ ! -d "/root/sat-front" ]; then
              cd /root
              git clone https://github.com/5kozarskabrigada/sat-mock-front.git sat-front
            fi
            
            cd /root/sat-front
            git pull origin main
            
            # Stop and remove existing containers and volumes
            docker compose down -v || true
            
            # Kill any process using port 3002
            lsof -ti:3002 | xargs kill -9 2>/dev/null || true
            fuser -k 3002/tcp 2>/dev/null || true
            
            # Remove old images completely
            docker rmi sat-front-web:latest 2>/dev/null || true
            docker image prune -f || true
            
            # Clean docker build cache
            docker builder prune -f || true
            
            # Build fresh without any cache
            docker compose build --no-cache --pull
            
            # Start with proper environment variables
            docker compose up -d
            
            echo "Frontend deployment completed"
            docker compose ps
            docker compose logs --tail=20 frontend

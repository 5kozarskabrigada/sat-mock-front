name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            # Clone repo if it doesn't exist, otherwise pull
            if [ ! -d "/root/sat-front" ]; then
              cd /root
              git clone https://github.com/5kozarskabrigada/sat-mock-front.git sat-front
            fi
            
            cd /root/sat-front
            git pull origin main
            
            # Stop and remove existing containers and volumes for THIS project only
            docker compose down -v || true
            
            # Find any container using port 3002 and stop it
            CONTAINER_ID=$(docker ps --filter "publish=3002" --format "{{.ID}}")
            if [ ! -z "$CONTAINER_ID" ]; then
              echo "Stopping container using port 3002: $CONTAINER_ID"
              docker stop $CONTAINER_ID || true
              docker rm $CONTAINER_ID || true
            fi
            
            # Find and kill any host process on port 3002 (multiple methods)
            PID=$(netstat -tlnp 2>/dev/null | grep ':3002 ' | awk '{print $7}' | cut -d'/' -f1 | head -n1)
            if [ ! -z "$PID" ]; then
              echo "Killing process $PID on port 3002"
              kill -9 $PID 2>/dev/null || true
              sleep 2
            fi
            
            # Also try ss command
            PID=$(ss -tlnp 2>/dev/null | grep ':3002 ' | grep -oP 'pid=\K[0-9]+' | head -n1)
            if [ ! -z "$PID" ]; then
              echo "Killing process $PID on port 3002 (via ss)"
              kill -9 $PID 2>/dev/null || true
              sleep 2
            fi
            
            # Remove old images completely
            docker rmi sat-front-web:latest 2>/dev/null || true
            docker image prune -f || true
            
            # Clean docker build cache
            docker builder prune -f || true
            
            # Build fresh without any cache
            docker compose build --no-cache --pull
            
            # Start with proper environment variables
            docker compose up -d
            
            echo "Frontend deployment completed"
            docker compose ps
            docker compose logs --tail=20 frontend
